# Render Blueprint for the CoolSpend FastAPI backend + its database.
# Deploy: push to GitHub, then in Render → New → Blueprint, point at this repo.
# Render reads this file and provisions BOTH the web service and a free Postgres,
# wiring DATABASE_URL automatically (no manual copy-paste). The frontend deploys
# separately on Vercel (see DEPLOY.md).

# Free managed Postgres — durable saved-run storage (metadata + heatmap blobs).
# Note: Render's free Postgres is deleted ~30 days after creation; fine for a demo,
# upgrade the plan for production. SQLite is the local default (DATABASE_URL unset).
databases:
  - name: coolspend-db
    plan: free
    databaseName: coolspend
    user: coolspend

services:
  - type: web
    name: coolspend-api
    runtime: python
    plan: free                # OK for a demo; upgrade to Starter if live UTCI grids OOM
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn coolspend.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # The Infrared API key — SECRET. Set its value in the Render dashboard; never
      # commit it. (sync:false keeps it out of this file.)
      - key: INFRARED_API_KEY
        sync: false
      # mock | cached | live. `live` runs real Infrared UTCI (~60-90s/eval, costs
      # API quota, needs the key). `cached` replays the bundled showcase and falls
      # back to mock for new polygons.
      - key: INFRARED_BACKEND
        value: live
      # Infrared weather endpoint has intermittent 500s; `auto` falls back to the
      # bundled measured EPW so a live run never hard-blocks on weather.
      - key: INFRARED_WEATHER_SOURCE
        value: auto
      # Comma-separated allowed browser origins — set to your Vercel URL(s) so the
      # frontend's cross-origin /api fetch is not blocked by CORS.
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Durable storage: Render injects the free Postgres connection string here
      # from the `databases` block above, so saved runs (metadata + heatmap blobs)
      # survive redeploys. The free web tier has NO persistent disk — keeping the
      # data in Postgres (not a file) is what makes "save → it's still there"
      # hold across a restart. store.py speaks both Postgres and SQLite.
      - key: DATABASE_URL
        fromDatabase:
          name: coolspend-db
          property: connectionString
