[tool.pytest.ini_options]
testpaths = ["coolspend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["web", "video", "node_modules", ".venv"]

# Deliberately narrow: syntax errors and genuinely undefined names only. This
# project lazy-imports heavy optional dependencies inside functions, so a
# style-first rule set reports hundreds of intentional patterns and hides the
# handful of findings that actually matter.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
