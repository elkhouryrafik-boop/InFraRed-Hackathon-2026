[tool.pytest.ini_options]
testpaths = ["coolspend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["web", "video", "node_modules", ".venv"]

# Narrow, honest rule set: real errors only (syntax, undefined names, unused
# imports). Style opinions are not enforced here — see the note in README.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
